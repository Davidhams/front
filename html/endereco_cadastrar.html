<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>exigirAdmin();</script>
    <script src="../js/endereco_cadastrar.js" defer></script>
    <title>Cadastrar Endereço</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./endereco_cadastrar.html" class="ativo">Cadastrar</a>
            <a href="./endereco_listar.html">Listar</a>
            <a href="./endereco_consultar.html">Consultar</a>
            <a href="./endereco_atualizar.html">Atualizar</a>
            <a href="./endereco_apagar.html">Apagar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Cadastrar Endereço</h1>
        <br>
        <form>
            <label for="idCliente">Código do Cliente</label>
            <input type="number" id="idCliente" required>

            <label for="condominio">Condomínio</label>
            <input type="text" id="condominio">

            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" required>

            <label for="numero">Número</label>
            <input type="text" id="numero" required>

            <label for="cep">CEP</label>
            <input type="text" id="cep" required>

            <label for="proximoBR101">Próximo à BR-101?</label>
            <select id="proximoBR101">
                <option value="false">Não</option>
                <option value="true">Sim</option>
            </select>

            <br>
            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>

</html>
