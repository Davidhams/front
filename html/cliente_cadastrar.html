<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>exigirAdmin();</script>
    <script src="../js/cliente_cadastrar.js" defer></script>
    <title>Cadastrar Cliente</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./cliente_cadastrar.html" class="ativo">Cadastrar</a>
            <a href="./cliente_listar.html">Listar</a>
            <a href="./cliente_consultar.html">Consultar</a>
            <a href="./cliente_atualizar.html">Atualizar</a>
            <a href="./cliente_apagar.html">Apagar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Cadastrar Cliente</h1>
        <br>
        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" required>

            <label for="telefone">Telefone</label>
            <input type="text" id="telefone">

            <label for="senha">Senha (deixe em branco para manter a atual, na atualização)</label>
            <input type="password" id="senha">

            <label for="tipoCliente">Tipo de Cliente</label>
            <select id="tipoCliente">
                <option value="CLIENTE">Cliente</option>
                <option value="ADMIN">Admin</option>
            </select>

            <br>
            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>

</html>
