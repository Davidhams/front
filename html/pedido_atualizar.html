<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>exigirAdmin();</script>
    <script src="../js/pedido_atualizar.js" defer></script>
    <title>Atualizar Pedido</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./pedido_cadastrar.html">Cadastrar</a>
            <a href="./pedido_listar.html">Listar</a>
            <a href="./pedido_consultar.html">Consultar</a>
            <a href="./pedido_atualizar.html" class="ativo">Atualizar</a>
            <a href="./pedido_apagar.html">Apagar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Atualizar Pedido</h1>
        <br>
        <label for="codBusca">codPedido</label>
        <input type="number" id="codBusca" required>
        <button id="btn_buscar" type="button">Buscar</button>
        <br><br>
        <form>
            <label for="idCliente">Código do Cliente</label>
            <input type="number" id="idCliente" required>
            <label for="idEndereco">Código do Endereço</label>
            <input type="number" id="idEndereco" required>
            <label for="dataPedido">Data do Pedido</label>
            <input type="date" id="dataPedido" required>
            <label for="horaPedido">Hora do Pedido</label>
            <input type="time" id="horaPedido" required>
            <label for="tipoEntrega">Tipo de Entrega</label>
            <select id="tipoEntrega" required>
                <option value="SAME_DAY">Same-Day</option>
                <option value="24H">24 Horas</option>
            </select>
            <label for="status">Status</label>
            <select id="status">
                <option value="PENDENTE">Pendente</option>
                <option value="EM_ROTA">Em Rota</option>
                <option value="ENTREGUE">Entregue</option>
                <option value="CANCELADO">Cancelado</option>
            </select>
            <label for="valorTotal">Valor Total</label>
            <input type="number" id="valorTotal" step="0.01">

            <br>
            <button id="btn_atualizar">Salvar Alterações</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>

</html>
