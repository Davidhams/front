<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>exigirAdmin();</script>
    <script src="../js/item_pedido_atualizar.js" defer></script>
    <title>Atualizar Item do Pedido</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./item_pedido_cadastrar.html">Cadastrar</a>
            <a href="./item_pedido_listar.html">Listar</a>
            <a href="./item_pedido_consultar.html">Consultar</a>
            <a href="./item_pedido_atualizar.html" class="ativo">Atualizar</a>
            <a href="./item_pedido_apagar.html">Apagar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Atualizar Item do Pedido</h1>
        <br>
        <label for="codBusca">codItemPedido</label>
        <input type="number" id="codBusca" required>
        <button id="btn_buscar" type="button">Buscar</button>
        <br><br>
        <form>
            <label for="idPedido">Código do Pedido</label>
            <input type="number" id="idPedido" required>
            <label for="idProduto">Código do Produto</label>
            <input type="number" id="idProduto" required>
            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" required>
            <label for="precoUnitario">Preço Unitário</label>
            <input type="number" id="precoUnitario" step="0.01" required>
            <label for="subtotal">Subtotal</label>
            <input type="number" id="subtotal" step="0.01" required>

            <br>
            <button id="btn_atualizar">Salvar Alterações</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>

</html>
