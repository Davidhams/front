<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>

    <script src="../js/avaliacao_atualizar.js" defer></script>
    <title>Atualizar Avaliação</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./avaliacao_cadastrar.html">Cadastrar</a>
            <a href="./avaliacao_listar.html">Listar</a>

        </nav>
        <hr>
    </header>
    <main>
        <h1>Atualizar Avaliação</h1>
        <br>
        <label for="codBusca">codAvaliacao</label>
        <input type="number" id="codBusca" required>
        <button id="btn_buscar" type="button">Buscar</button>
        <br><br>
        <form>
            <label for="idCliente">Código do Cliente</label>
            <input type="number" id="idCliente" required>
            <label for="idProduto">Código do Produto</label>
            <input type="number" id="idProduto" required>
            <label for="nota">Nota (1 a 5)</label>
            <input type="number" id="nota" required>
            <label for="comentario">Comentário</label>
            <textarea id="comentario"></textarea>
            <label for="dataAvaliacao">Data da Avaliação</label>
            <input type="date" id="dataAvaliacao" required>

            <br>
            <button id="btn_atualizar">Salvar Alterações</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>
