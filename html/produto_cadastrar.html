<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>exigirAdmin();</script>
    <script src="../js/imagem-utils.js"></script>
    <script src="../js/produto_cadastrar.js" defer></script>
    <title>Cadastrar Produto</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./produto_cadastrar.html" class="ativo">Cadastrar</a>
            <a href="./produto_listar.html">Listar</a>
            <a href="./produto_consultar.html">Consultar</a>
            <a href="./produto_atualizar.html">Atualizar</a>
            <a href="./produto_apagar.html">Apagar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Cadastrar Produto</h1>
        <br>
        <form>
            <label for="nomeProduto">Nome do Produto</label>
            <input type="text" id="nomeProduto" required>

            <label for="categoria">Categoria</label>
            <select id="categoria" required>
                <option value="AUTOMACAO">Automação</option>
                <option value="CAMA_MESA_BANHO">Cama, Mesa e Banho</option>
                <option value="DESIGN_DECORACAO">Design e Decoração</option>
                <option value="MOVEIS_DECORACAO">Móveis e Decoração</option>
                <option value="UTILIDADES_GOURMET">Utilidades Gourmet</option>
            </select>

            <label for="precoUnitario">Preço Unitário</label>
            <input type="number" id="precoUnitario" step="0.01" required>

            <label for="quantidadeEstoque">Quantidade em Estoque</label>
            <input type="number" id="quantidadeEstoque">

            <label for="pesoKg">Peso (Kg)</label>
            <input type="number" id="pesoKg" step="0.01">

            <label for="exigeMontagem">Exige Montagem?</label>
            <select id="exigeMontagem">
                <option value="false">Não</option>
                <option value="true">Sim</option>
            </select>

            <label for="imagemBase64">Imagem do Produto</label>
            <input type="file" id="imagemBase64" accept="image/*">
            <br>
            <img id="imagemBase64_preview" class="produto_imagem_preview" src="" alt="">

            <br>
            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>

</html>
