<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>exigirAdmin();</script>
    <script src="../js/fornecedor_cadastrar.js" defer></script>
    <title>Cadastrar Fornecedor</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./fornecedor_cadastrar.html" class="ativo">Cadastrar</a>
            <a href="./fornecedor_listar.html">Listar</a>
            <a href="./fornecedor_consultar.html">Consultar</a>
            <a href="./fornecedor_atualizar.html">Atualizar</a>
            <a href="./fornecedor_apagar.html">Apagar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Cadastrar Fornecedor</h1>
        <br>
        <form>
            <label for="nomeFornecedor">Nome do Fornecedor</label>
            <input type="text" id="nomeFornecedor" required>

            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" required>

            <label for="categoriaFornecida">Categoria Fornecida</label>
            <select id="categoriaFornecida" required>
                <option value="AUTOMACAO">Automação</option>
                <option value="CAMA_MESA_BANHO">Cama, Mesa e Banho</option>
                <option value="DESIGN_DECORACAO">Design e Decoração</option>
                <option value="MOVEIS_DECORACAO">Móveis e Decoração</option>
                <option value="UTILIDADES_GOURMET">Utilidades Gourmet</option>
            </select>

            <label for="prazoEntregaDias">Prazo de Entrega (dias)</label>
            <input type="number" id="prazoEntregaDias" required>

            <br>
            <button id="btn_cadastrar">Cadastrar</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>

</html>
