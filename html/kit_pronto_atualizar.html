<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>exigirAdmin();</script>
    <script src="../js/kit_pronto_atualizar.js" defer></script>
    <title>Atualizar Kit Pronto</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./kit_pronto_cadastrar.html">Cadastrar</a>
            <a href="./kit_pronto_listar.html">Listar</a>
            <a href="./kit_pronto_consultar.html">Consultar</a>
            <a href="./kit_pronto_atualizar.html" class="ativo">Atualizar</a>
            <a href="./kit_pronto_apagar.html">Apagar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Atualizar Kit Pronto</h1>
        <br>
        <label for="codBusca">codKit</label>
        <input type="number" id="codBusca" required>
        <button id="btn_buscar" type="button">Buscar</button>
        <br><br>
        <form>
            <label for="nomeKit">Nome do Kit</label>
            <input type="text" id="nomeKit" required>
            <label for="descricao">Descrição</label>
            <textarea id="descricao"></textarea>
            <label for="precoKit">Preço do Kit</label>
            <input type="number" id="precoKit" step="0.01" required>
            <label for="publicoAlvo">Público Alvo</label>
            <select id="publicoAlvo" required>
                <option value="MORADOR">Morador</option>
                <option value="INVESTIDOR">Investidor</option>
            </select>

            <br>
            <button id="btn_atualizar">Salvar Alterações</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>

</html>
