<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <script>const RAIZ = "../";</script>
    <script src="../js/config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/nav.js"></script>
    <script>exigirAdmin();</script>
    <script src="../js/cliente_atualizar.js" defer></script>
    <title>Atualizar Cliente</title>
</head>

<body>
    <header>
        <nav id="app-nav"></nav>
        <nav class="subnav">
            <a href="./admin_painel.html">Painel Admin</a>
            <a href="./cliente_cadastrar.html">Cadastrar</a>
            <a href="./cliente_listar.html">Listar</a>
            <a href="./cliente_consultar.html">Consultar</a>
            <a href="./cliente_atualizar.html" class="ativo">Atualizar</a>
            <a href="./cliente_apagar.html">Apagar</a>
        </nav>
        <hr>
    </header>
    <main>
        <h1>Atualizar Cliente</h1>
        <br>
        <label for="codBusca">codCliente</label>
        <input type="number" id="codBusca" required>
        <button id="btn_buscar" type="button">Buscar</button>
        <br><br>
        <form>
            <label for="nome">Nome</label>
            <input type="text" id="nome" required>
            <label for="email">E-mail</label>
            <input type="email" id="email" required>
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone">
            <label for="senha">Senha (deixe em branco para manter a atual, na atualização)</label>
            <input type="password" id="senha">
            <label for="tipoCliente">Tipo de Cliente</label>
            <select id="tipoCliente">
                <option value="CLIENTE">Cliente</option>
                <option value="ADMIN">Admin</option>
            </select>

            <br>
            <button id="btn_atualizar">Salvar Alterações</button>
        </form>
        <br>
        <p id="resposta"></p>
    </main>
</body>

</html>
